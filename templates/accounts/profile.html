{% extends "base.html" %}
{% block title %}Profile{% endblock %}
{% block content %}
  <h2>Profile</h2>
  <p>Username: {{ user.username }}</p>
  <p>Role: {{ user.get_role_display }}</p>
  {% if user.is_library_staff %}
    <a href="{% url 'admin:index' %}" class="btn btn-outline-dark">Admin panel</a>
  {% endif %}
{% endblock %}
