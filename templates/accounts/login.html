{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
  <h2>Log in</h2>
  <form method="post">
    {% csrf_token %}
    {% include "_form.html" %}
    <button class="btn btn-primary">Log in</button>
    <a href="{% url 'accounts:password_reset' %}" class="ms-3">Forgot your password?</a>
  </form>
{% endblock %}
