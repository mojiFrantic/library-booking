{% extends "base.html" %}
{% block content %}
  {% if validlink %}
    <h2>Choose a new password</h2>
    <form method="post">
      {% csrf_token %}
      {% include "_form.html" %}
      <button class="btn btn-primary">Change password</button>
    </form>
  {% else %}
    <p>This link is invalid or has expired.</p>
  {% endif %}
{% endblock %}
