<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Library{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar bg-body-tertiary mb-4">
  <div class="container">
    <a class="navbar-brand" href="{% url 'home' %}">Library</a>
    <div class="d-flex gap-2 align-items-center">
      {% if user.is_authenticated %}
        <a href="{% url 'accounts:profile' %}" class="btn btn-sm btn-outline-secondary">{{ user.username }}</a>
        <form method="post" action="{% url 'accounts:logout' %}">
          {% csrf_token %}
          <button class="btn btn-sm btn-outline-danger">Log out</button>
        </form>
      {% else %}
        <a href="{% url 'accounts:login' %}" class="btn btn-sm btn-primary">Log in</a>
        <a href="{% url 'accounts:register' %}" class="btn btn-sm btn-outline-primary">Sign up</a>
      {% endif %}
    </div>
  </div>
</nav>
<main class="container" style="max-width: 640px;">
  {% block content %}{% endblock %}
</main>
</body>
</html>
